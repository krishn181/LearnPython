{% extends "base.html" %}
{% block content %}
<h2>Are you sure want to delete {{post.title}}</h2>
<form action="" method="POST" class="mt-3">
{% csrf_token %}
    <button type="submit"class="btn btn-danger">Delete</button>
    <a href="{% url "post_detail" post.pk %}" class="btn btn-secondary">Cancel</a>
</form>


{% endblock content %}
