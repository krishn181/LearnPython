<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #4f46e5, #2563eb);
        }

        .container{
            width: 420px;
            background: #fff;
            padding: 40px 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .container:hover{
            transform: translateY(-8px);
        }

        h2{
            font-size: 32px;
            color: #1f2937;
            margin-bottom: 20px;
        }

        h2 span{
            color: #2563eb;
        }

        p{
            color: #555;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn{
            display: inline-block;
            padding: 12px 28px;
            background: #2563eb;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            transition: 0.3s;
        }

        .btn:hover{
            background: #1d4ed8;
        }

        .footer{
            margin-top: 25px;
            font-size: 13px;
            color: #888;
        }

        @media(max-width:480px){
            .container{
                width: 90%;
                padding: 30px 20px;
            }

            h2{
                font-size: 26px;
            }

            p{
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Welcome <span>{{ username }}</span> 🎉</h2>

        <p>
            Thanks for joining our course.
            We are excited to have you with us and wish you a wonderful learning journey!
        </p>

        <a href="#" class="btn">Start Learning</a>

        <div class="footer">
            © 2026 Learning Platform. All Rights Reserved.
        </div>
    </div>

</body>
</html>
